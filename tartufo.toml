[tool.tartufo]
repo-path = "."
regex = true
entropy = true

exclude-path-patterns = [
    {path-pattern = 'tartufo\.toml$', reason = 'contains many high entropy signatures'},
    {path-pattern = 'nvim/lazy-lock\.json$', reason = 'contains many high entropy git commit SHAs'},
]

exclude-entropy-patterns = [
    {path-pattern = "dotfiles/\\.bashrc$", pattern = "\\$SEI_SUBSTANCE_DIR/lib/\\S+\\.sh", reason = "source path references are not credentials"},
    {path-pattern = "profile/ascd\\.bashrc$", pattern = "\\$SEI_SUBSTANCE_DIR/lib/\\S+\\.sh", reason = "source path references are not credentials"},
    {path-pattern = "profile/sei\\.bashrc$", pattern = "\\$SEI_SUBSTANCE_DIR/lib/\\S+\\.sh", reason = "source path references are not credentials"},
    {path-pattern = "lib/acmd\\.sh$", pattern = "\\$SEI_SUBSTANCE_DIR/profile/\\S+", reason = "source path references are not credentials"},
    {path-pattern = "lib/acmd\\.sh$", pattern = "\\$SEI_SUBSTANCE_DIR/lib/\\S+", reason = "source path references are not credentials"},
]

exclude-signatures = [
