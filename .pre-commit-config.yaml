repos:
  - repo: https://github.com/satoseino/gelato
    rev: "v0.1.0"
    hooks:
      - id: gelato

  - repo: https://github.com/satoseino/shell-cmd-on-change
    rev: "2.1.0"
    hooks:
      - id: shell-cmd-on-change
        name: set-up
        args:
          - "-P.keep"
          - "~/.config/substance/set-up.sh"
        stages: [post-merge]
        always_run: true
        verbose: true
