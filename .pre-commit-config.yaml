repos:
  - repo: https://github.com/satoseino/gelato
    rev: "v0.2.0"
    hooks:
      - id: gelato

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: &shell_files >-
          (?x)^(
            bin/[^/]+|
            completions/[^/]+|
            lib/[^/]+\.sh|
            profile/[^/]+\.bashrc|
            dotfiles/\.bash(rc|_profile|_logout)|
            claude-user/skills/[^/]+/scripts/.+|
            test/[^/]+\.(sh|bash)|
            test/test_helper/[^/]+\.bash|
            test/test_helper/fake-gh|
            set-up\.sh
          )$

      - id: shfmt
        name: shfmt
        entry: shfmt -w -i 2
        language: system
        files: *shell_files

  - repo: https://github.com/satoseino/shell-cmd-on-change
    rev: "2.1.0"
    hooks:
      - id: shell-cmd-on-change
        name: set-up
        args:
          - "-P.keep"
          - "~/.config/substance/set-up.sh"
        stages: [post-merge]
        always_run: true
        verbose: true

      - id: shell-cmd-on-change
        name: nvim-lazy-restore
        args:
          - "-Pnvim/lazy-lock.json"
          - "nvim --headless '+Lazy! restore' +qa"
        stages: [post-merge]
        always_run: true
        verbose: true
