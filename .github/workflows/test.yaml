name: Skill script tests

on:
  push:
    branches: [main]
    paths:
      - "claude-user/skills/**"
      - "test/**"
      - ".gitmodules"
      - ".github/workflows/test.yaml"
  pull_request:
    branches: [main]
    paths:
      - "claude-user/skills/**"
      - "test/**"
      - ".gitmodules"
      - ".github/workflows/test.yaml"

jobs:
  bats-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Print tool versions
        run: |
          bash --version | head -n 1
          git --version | head -n 1
          jq --version | head -n 1

      - name: Run bats tests
        run: BATS_FILE_EXTENSION=sh ./test/bats/bin/bats test/
